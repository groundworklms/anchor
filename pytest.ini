[pytest]
# The source tree is not a package and each directory is deployed flat onto the Jetson,
# so imports are resolved by tests/conftest.py putting the deployed roots on sys.path
# rather than by any package layout here.
#
# Run from the repo root:  py -m pytest tests -q
testpaths = tests
python_files = test_*.py
# no:cacheprovider keeps a .pytest_cache directory out of the repo root, which is not
# in .gitignore.
addopts = -q --strict-markers -p no:cacheprovider
filterwarnings =
    error::SyntaxWarning
